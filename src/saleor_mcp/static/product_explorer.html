<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saleor Product Explorer</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #22c55e;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.025em; }

        .badge {
            background: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        #status-bar {
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--text-muted);
        }

        #product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .product-img {
            width: 100%;
            height: 130px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 11px;
            overflow: hidden;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info { padding: 10px; }

        .product-name {
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .product-price {
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
        }

        /* Modal */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(16px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 14px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 { font-size: 16px; }

        .modal-body { padding: 14px; }

        .modal-footer {
            padding: 10px 14px;
            background: #f8fafc;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        button {
            padding: 7px 14px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary { background: #e2e8f0; color: var(--text-main); }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-success { background: var(--success); color: white; }

        .variant-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
        .variant-btn { font-size: 11px; padding: 4px 8px; }
        .variant-btn.active { background: var(--primary); color: white; }

        .detail-desc {
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.5;
            margin: 6px 0;
            max-height: 80px;
            overflow-y: auto;
        }

        .detail-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            margin: 8px 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            color: var(--text-muted);
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<header>
    <h1>🛍 Saleor Explorer</h1>
    <span id="cart-badge" class="badge">Cart: 0</span>
</header>

<div id="status-bar">Loading products...</div>

<div id="product-grid"></div>

<div id="detail-overlay" class="overlay">
    <div class="modal">
        <div class="modal-header">
            <h2 id="detail-name">Product</h2>
            <button class="close-btn" id="close-modal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="detail-desc" id="detail-desc"></div>
            <div class="detail-price" id="detail-price"></div>
            <div>
                <strong style="font-size:11px;">Variants:</strong>
                <div class="variant-list" id="variant-list"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="close-modal-2">Close</button>
            <button class="btn-primary" id="add-cart-btn">Add to Cart</button>
        </div>
    </div>
</div>

<script>
(function() {
    // ═══════════════════════════════════════════════════
    // Read products from embedded data (injected by server)
    // ═══════════════════════════════════════════════════
    var products = window.__PRODUCTS__ || [];

    var statusBar = document.getElementById("status-bar");
    var productGrid = document.getElementById("product-grid");
    var detailOverlay = document.getElementById("detail-overlay");
    var cartBadge = document.getElementById("cart-badge");
    var cartCount = 0;
    var selectedVariantId = null;

    // ═══════════════════════════════════════════════════
    // Render products immediately
    // ═══════════════════════════════════════════════════
    function renderProducts() {
        productGrid.innerHTML = "";
        if (!products || products.length === 0) {
            productGrid.innerHTML = '<div class="loading">No products found.</div>';
            statusBar.textContent = "No products available.";
            return;
        }

        statusBar.textContent = "✅ " + products.length + " products loaded";

        for (var i = 0; i < products.length; i++) {
            (function(p) {
                var card = document.createElement("div");
                card.className = "product-card";

                var imgUrl = p.thumbnail ? p.thumbnail.url : null;
                var price = p.pricing ? ("$" + p.pricing.amount.toFixed(2) + " " + p.pricing.currency) : "N/A";

                card.innerHTML =
                    '<div class="product-img">' +
                    (imgUrl ? '<img src="' + imgUrl + '" alt="' + (p.name || '') + '" onerror="this.parentElement.textContent=\'No Image\'">' : 'No Image') +
                    '</div>' +
                    '<div class="product-info">' +
                    '<div class="product-name">' + (p.name || "Unnamed") + '</div>' +
                    '<div class="product-price">' + price + '</div>' +
                    '</div>';

                card.addEventListener("click", function() { showDetail(p); });
                productGrid.appendChild(card);
            })(products[i]);
        }
    }

    // ═══════════════════════════════════════════════════
    // Product detail modal
    // ═══════════════════════════════════════════════════
    function showDetail(product) {
        document.getElementById("detail-name").textContent = product.name || "Product";

        var desc = product.description || "No description";
        try {
            var parsed = JSON.parse(desc);
            if (parsed.blocks) {
                desc = parsed.blocks.map(function(b) {
                    return b.data && b.data.text ? b.data.text : "";
                }).join("\n");
            }
        } catch(e) { /* use as-is */ }
        document.getElementById("detail-desc").textContent = desc || "No description available";

        var price = product.pricing ? ("$" + product.pricing.amount.toFixed(2) + " " + product.pricing.currency) : "N/A";
        document.getElementById("detail-price").textContent = price;

        // Variants
        var variantList = document.getElementById("variant-list");
        variantList.innerHTML = "";
        selectedVariantId = null;

        var variants = product.variants || [];
        if (variants.length > 0) {
            selectedVariantId = variants[0].id;
            for (var i = 0; i < variants.length; i++) {
                (function(v, idx) {
                    var btn = document.createElement("button");
                    btn.className = "btn-secondary variant-btn" + (idx === 0 ? " active" : "");
                    btn.textContent = v.name || "Default";
                    btn.addEventListener("click", function(e) {
                        e.stopPropagation();
                        selectedVariantId = v.id;
                        var btns = variantList.querySelectorAll(".variant-btn");
                        for (var j = 0; j < btns.length; j++) btns[j].classList.remove("active");
                        btn.classList.add("active");
                    });
                    variantList.appendChild(btn);
                })(variants[i], i);
            }
        } else {
            variantList.innerHTML = '<span style="font-size:11px;color:var(--text-muted);">No variants</span>';
        }

        var addBtn = document.getElementById("add-cart-btn");
        addBtn.textContent = "Add to Cart";
        addBtn.disabled = !selectedVariantId;
        addBtn.className = "btn-primary";

        detailOverlay.style.display = "flex";
    }

    // ═══════════════════════════════════════════════════
    // Add to cart (visual only — actual cart integration
    // requires callServerTool which may not be available)
    // ═══════════════════════════════════════════════════
    function handleAddToCart() {
        if (!selectedVariantId) return;

        var addBtn = document.getElementById("add-cart-btn");
        cartCount++;
        cartBadge.textContent = "Cart: " + cartCount;
        addBtn.textContent = "✓ Added!";
        addBtn.className = "btn-success";
        statusBar.textContent = "✅ Item added to cart! (Variant: " + selectedVariantId + ")";

        setTimeout(function() {
            detailOverlay.style.display = "none";
        }, 600);
    }

    // ═══════════════════════════════════════════════════
    // Event listeners
    // ═══════════════════════════════════════════════════
    document.getElementById("close-modal").addEventListener("click", function() {
        detailOverlay.style.display = "none";
    });
    document.getElementById("close-modal-2").addEventListener("click", function() {
        detailOverlay.style.display = "none";
    });
    document.getElementById("add-cart-btn").addEventListener("click", handleAddToCart);
    detailOverlay.addEventListener("click", function(e) {
        if (e.target === detailOverlay) detailOverlay.style.display = "none";
    });

    // ═══════════════════════════════════════════════════
    // Initialize: render products immediately from embedded data
    // ═══════════════════════════════════════════════════
    renderProducts();
})();
</script>
</body>
</html>
