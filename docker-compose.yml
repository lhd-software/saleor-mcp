services:
  saleor-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: saleor-mcp:latest
    container_name: saleor-mcp
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Restrict chỉ cho phép domain bi193.com; bỏ trống để allow all
      ALLOWED_DOMAIN_PATTERN: "https:\\/\\/api\\.bi193\\.com\\/graphql\\/"
      # Public URL where this server is reachable from the UI iframe. Used
      # to rewrite thumbnail URLs through /img proxy and to set the UI CSP.
      # Override to https://store4ai-mcp.bi193.com in production deploy.
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8000}"
      # Hosts whose images the /img proxy is allowed to fetch. If blank,
      # falls back to the host of SALEOR_API_URL.
      ALLOWED_IMAGE_HOSTS: "${ALLOWED_IMAGE_HOSTS:-api.bi193.com}"
      # Optional: fallback nếu client không gửi headers
      # SALEOR_API_URL: "https://api.bi193.com/graphql/"
      # SALEOR_AUTH_TOKEN: "your_token_here"
      LOGLEVEL: "INFO"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Nếu dùng chung network với saleor-core:
    # networks:
    #   - saleor_network

# networks:
#   saleor_network:
#     external: true
#     name: saleor_saleor  # Tên network của saleor-core (kiểm tra bằng: docker network ls)
